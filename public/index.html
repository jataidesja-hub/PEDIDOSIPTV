<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEDIDOS IPTV</title>
<link rel="stylesheet" href="https://vjs.zencdn.net/8.10.0/video-js.min.css">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="login-screen">
  <form id="login-form">
    <h1>&#9654; PEDIDOS IPTV</h1>
    <p class="sub">Entre com seu usuário e senha</p>
    <input id="l-user" type="text" placeholder="Usuário" autocomplete="username" required>
    <input id="l-pass" type="password" placeholder="Senha" autocomplete="current-password" required>
    <button id="l-btn" type="submit">Entrar</button>
    <div id="l-err"></div>
  </form>
</div>
<div id="app" hidden>
  <header>
    <a href="#" id="home">&#9654; PEDIDOS IPTV</a>
    <button id="back-btn" class="back-btn" hidden>&#8592; Voltar</button>
    <nav id="crumbs"></nav>
    <div class="header-right">
      <input id="search" type="search" placeholder="Buscar título...">
      <span id="uinfo"></span>
      <button id="app-fs" title="Tela cheia">&#9974; Tela cheia</button>
      <button id="refresh" title="Atualizar">&#8635; Atualizar</button>
      <button id="logout" title="Sair">Sair</button>
    </div>
  </header>
  <div id="cat-bar" class="cat-bar"></div>
  <div id="subcat-bar" class="subcat-bar" hidden></div>
  <main><div id="grid" class="grid"></div><div id="msg"></div></main>
</div>
<div id="player" hidden>
  <div class="pbar">
    <h2 id="ptitle"></h2>
    <div class="pactions">
      <button id="prev-ep" class="pbtn" hidden>&#9664; Anterior</button>
      <button id="next-ep" class="pbtn" hidden>Próximo &#9654;</button>
      <button id="player-fs" class="pbtn">&#9974; Tela cheia</button>
      <button id="toggle-watched"></button>
      <button id="close">&#10005; Voltar</button>
    </div>
  </div>
  <div id="vjs-wrap">
    <video id="vid" class="video-js vjs-big-play-centered" controls playsinline preload="auto"></video>
  </div>
  <iframe id="frame" hidden allow="autoplay; fullscreen" allowfullscreen></iframe>
  <div class="pfooter">
    <button id="back10" class="pbtn">&#8630; -10s</button>
    <button id="fwd10" class="pbtn">+10s &#8631;</button>
    <button id="player-fs2" class="pbtn">&#9974; Tela cheia</button>
    <button id="alt">Player alternativo (Drive)</button>
  </div>
</div>
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="app.js"></script></body></html>
